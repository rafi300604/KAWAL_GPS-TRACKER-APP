# Broker MQTT untuk jalur pengganti HTTPS (device kirim lewat GSM/seluler,
# hemat kuota data -- lihat FIRMWARE_CONTRACT.md dan app/gps_mqtt_client.py).
# File ini template; yang dipakai broker adalah salinannya di VPS
# (/opt/kawal-gps/mqtt/config/mosquitto.conf).

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
per_listener_settings true

# Listener PUBLIK (di-publish ke host lewat docker-compose.yml) -- ini yang
# dipakai device fisik (modem seluler, dari internet publik). Wajib TLS +
# autentikasi, beda dari listener internal di bawah.
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwd
# Batasi tiap device ke topic miliknya sendiri (telemetry/, cmd-ack/, cmd/).
acl_file /mosquitto/config/acl

# File cert/key TIDAK di-commit ke git (lihat .gitignore) -- generate di VPS
# sendiri, lihat instruksi di README bagian "Setup broker MQTT".
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# Listener INTERNAL -- SENGAJA TIDAK di-publish ke host (lihat
# docker-compose.yml, cuma 8883 yang ada di "ports:"), jadi cuma bisa
# diakses container lain di network kawal_gps_internal yang sama (mis.
# backend/api) -- bukan dari internet publik. Anonymous + tanpa TLS di sini
# aman karena batasnya jaringan Docker itu sendiri, bukan port publik.
# Backend memakai listener ini untuk membaca telemetry DAN mengirim perintah
# (cmd/<SN>), jadi tidak diberi ACL.
listener 1883
allow_anonymous true
