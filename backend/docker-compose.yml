services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    # User/password/nama database SEMUA diambil dari .env (lewat ${VAR}).
    # Tidak ada nilai hardcode di sini.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - telemetry_internal

    healthcheck:
      # Sengaja TIDAK use "-d <db>" -- database aplikasi mungkin nanti
      # disaexist (volume lama), dan kesehatan db cuma butuh server jalan.
      # Database sendiri auto-creat oleh docker-entrypoint.sh sebelum migrasi.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: telemetry-apigps
    ports:
      - "127.0.0.1:8555:8000"
    build: .

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    # DATABASE_URL dibangun dari variabel .env -- bukan nilai hardcode.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEVICE_API_KEY: ${DEVICE_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}

    expose:
      - "8000"

    networks:
      - telemetry_internal
      - devops_proxy

networks:
  telemetry_internal:
    driver: bridge

  devops_proxy:
    external: true
    name: devops_default

volumes:
  db_data:
